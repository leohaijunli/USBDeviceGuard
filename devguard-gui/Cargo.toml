[package]
name = "devguard-gui"
description = "devguard desktop UI, written in Rust with Native Shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["linux-desktop"]
# Headless Linux tests can omit GTK; the desktop build still requires it.
linux-desktop = ["dep:nsh-platform-linux"]

[dependencies]
devguard-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
clap.workspace = true
env_logger = "0.11"
tokio = { version = "1", default-features = false, features = ["sync"] }
nsh-core = "=0.4.0"
nsh-base = { version = "=0.4.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
nsh-platform-linux = { version = "=0.4.0", default-features = false, optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
base64 = "0.22"
tokio = { version = "1", default-features = false, features = ["sync"] }
nsh-platform-windows = { version = "=0.4.0", default-features = false }

[dev-dependencies]
nsh-engine = { version = "=0.4.0", default-features = false }
nsh-testing = { version = "=0.4.0", default-features = false }
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
devguardd = { path = "../devguardd" }
